name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build comes first: `codemirror-lang-srl` imports the SPARQL
      # package by name, so typechecking it needs that package's emitted
      # declarations. After that, the layers run in the order that fails
      # fastest.
      - name: Build the grammars
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      # Conformance, tree shapes and editor behaviour. A grammar change that
      # drops a conformance test from passing is a failing build, not a ratchet:
      # the expected-fail lists are asserted exactly, so an entry that starts
      # passing must be removed and one that stops passing fails here.
      - name: Unit and conformance tests
        run: pnpm exec vitest run

      # The demo is not published, but it is the fastest way to see a grammar
      # change, so it must not be allowed to rot.
      - name: Build the demo
        run: node demo/build.mjs

      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  corpus:
    # The vendored corpora are committed, so a `vendor-corpus` run against the
    # pinned commit must be a no-op. If it is not, either the script or the pin
    # has drifted from what the tests are scoring against.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run vendor-corpus
      - name: The vendored corpus matches its pin
        run: git diff --exit-code -- packages/*/test/corpus

  release:
    needs: [test, corpus]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Open a release PR, or publish one that has been merged
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
