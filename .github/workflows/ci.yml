name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build comes first: `@kurrawongai/codemirror-lang-srl` imports the SPARQL
      # package by name, so typechecking it needs that package's emitted
      # declarations. After that, the layers run in the order that fails
      # fastest.
      - name: Build the grammars
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      # Conformance, tree shapes and editor behaviour. A grammar change that
      # drops a conformance test from passing is a failing build, not a ratchet:
      # the expected-fail lists are asserted exactly, so an entry that starts
      # passing must be removed and one that stops passing fails here.
      - name: Unit and conformance tests
        run: pnpm exec vitest run

      # The demo is not published, but it is the fastest way to see a grammar
      # change, so it must not be allowed to rot.
      - name: Build the demo
        run: node demo/build.mjs

      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  corpus:
    # The vendored corpora are committed, so a `vendor-corpus` run against the
    # pinned commit must be a no-op. If it is not, either the script or the pin
    # has drifted from what the tests are scoring against.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run vendor-corpus
      - name: The vendored corpus matches its pin
        run: git diff --exit-code -- packages/*/test/corpus

  # Publish the demo to GitHub Pages on every merge to main, but only behind a
  # green `test` job — a demo that does not parse is worse than a stale one.
  #
  # Needs Settings → Pages → Source: "GitHub Actions". Until that is set the job
  # fails on deploy with a 404, the same shape of repository-policy refusal as
  # the release job's.
  demo:
    needs: [test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Its own concurrency group, and no cancelling: the workflow-level group
    # cancels in-progress runs, which would abort a half-finished deployment.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Builds the three packages first, so the demo runs the grammars from
      # this commit rather than anything published.
      - run: pnpm run demo:build

      # `enablement` turns Pages on through the API if it is not already, using
      # the `pages: write` permission below — so this job does not need a
      # one-time visit to Settings → Pages the way the release job needs its
      # own toggle. If the token is ever refused, the fallback is that setting:
      # Source → "GitHub Actions".
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    needs: [test, corpus]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Open a release PR, or publish one that has been merged
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
