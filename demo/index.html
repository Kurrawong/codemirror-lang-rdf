<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>codemirror-lang-rdf — demo</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

        --bg: #f6f7f9;
        --panel-bg: #ffffff;
        --editor-bg: #ffffff;
        --editor-active: #f2f4f7;
        --editor-selection: #cfe3ff;
        --editor-bracket: #dcecff;
        --fg: #1d2129;
        --fg-muted: #5a6472;
        --fg-faint: #8b95a3;
        --rule: #e2e5ea;
        --rule-strong: #c6ccd5;
        --accent: #2c62c8;
        --accent-fg: #ffffff;
        --ok: #1f7a4d;
        --danger: #c0392b;
        --warning: #a86a00;

        --syntax-keyword: #7a3ba8;
        --syntax-comment: #7b8794;
        --syntax-punct: #6b7480;
        --rdf-iri: #1f6f8b;
        --rdf-literal: #b3541e;
        --rdf-qualifier: #7b8794;
        --rdf-var: #2c62c8;
        --rdf-bnode: #8a3ea8;

        /* The RDF 1.2 term brackets. The palette blocks below reassign these. */
        --rdf-reified: #b0197f;
        --rdf-tripleterm: #1a7f5a;
        --rdf-annotation: #8a6d00;
        --rdf-reifier: #b0197f;
        /* The tint behind a whole 1.2 construct; off unless a palette sets it. */
        --rdf-region-bg: transparent;
      }

      :root[data-theme='dark'] {
        --bg: #16181d;
        --panel-bg: #1c1f26;
        --editor-bg: #1c1f26;
        --editor-active: #24282f;
        --editor-selection: #2c3d5a;
        --editor-bracket: #33445f;
        --fg: #e4e7ec;
        --fg-muted: #a8b0bc;
        --fg-faint: #737d8c;
        --rule: #2c313a;
        --rule-strong: #3d444f;
        --accent: #6ea8fe;
        --accent-fg: #10131a;
        --ok: #58c896;
        --danger: #f08a80;
        --warning: #e0b062;

        --syntax-keyword: #c792ea;
        --syntax-comment: #6f7987;
        --syntax-punct: #98a1ad;
        --rdf-iri: #79c0d6;
        --rdf-literal: #e5a06a;
        --rdf-qualifier: #8d97a4;
        --rdf-var: #6ea8fe;
        --rdf-bnode: #d18ae8;

        --rdf-reified: #f191ce;
        --rdf-tripleterm: #6fd0a8;
        --rdf-annotation: #e0b062;
        --rdf-reifier: #f191ce;
        --rdf-region-bg: transparent;
      }

      /*
       * Palettes.
       *
       * All three drive the same `HighlightStyle`, whose colours are `var(--…)`
       * references resolved at paint time — so switching one is an attribute
       * flip, with no reactivity and no re-created editor. The `[data-theme]`
       * variants carry more specificity than the base theme blocks above, which
       * is what lets a palette differ between light and dark.
       */

      /* The default. Brackets coloured per construct, and a tint behind each
         construct so its extent is visible where they nest. */
      :root[data-palette='rdf12'] {
        --rdf-region-bg: rgba(176, 25, 127, 0.07);
      }
      :root[data-palette='rdf12'][data-theme='dark'] {
        --rdf-region-bg: rgba(241, 145, 206, 0.11);
      }

      /* What a theme that has never heard of RDF 1.2 gives you: the 1.2
         brackets fall back to the ordinary punctuation colour. */
      :root[data-palette='conventional'] {
        --rdf-reified: var(--syntax-punct);
        --rdf-tripleterm: var(--syntax-punct);
        --rdf-annotation: var(--syntax-punct);
        --rdf-reifier: var(--syntax-punct);
      }

      /* Terms first: RDF terms carry the colour, syntax recedes. For reading
         data rather than editing it. */
      :root[data-palette='terms'] {
        --syntax-keyword: #97a0ad;
        --syntax-punct: #b9c0c9;
        --rdf-iri: #0b6e8a;
        --rdf-literal: #a33d00;
        --rdf-var: #1f4fbf;
        --rdf-bnode: #7a1fa8;
        --rdf-reified: #b9c0c9;
        --rdf-tripleterm: #b9c0c9;
        --rdf-annotation: #b9c0c9;
        --rdf-reifier: #b9c0c9;
      }
      :root[data-palette='terms'][data-theme='dark'] {
        --syntax-keyword: #6b7482;
        --syntax-punct: #565f6b;
        --rdf-iri: #7fd4ee;
        --rdf-literal: #ffb27a;
        --rdf-var: #8ab8ff;
        --rdf-bnode: #e2a2f5;
        --rdf-reified: #565f6b;
        --rdf-tripleterm: #565f6b;
        --rdf-annotation: #565f6b;
        --rdf-reifier: #565f6b;
      }

      * { box-sizing: border-box; }

      /* `hidden` must beat the `display` rules below, which outrank the UA sheet. */
      [hidden] { display: none !important; }

      html, body { height: 100%; }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font-family: var(--sans);
        font-size: 14px;
        color: var(--fg);
        background: var(--bg);
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
        padding: 12px 16px;
        border-bottom: 1px solid var(--rule);
        background: var(--panel-bg);
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        font-family: var(--mono);
      }

      header p {
        margin: 0;
        color: var(--fg-muted);
        font-size: 13px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-left: auto;
      }

      label { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-muted); font-size: 13px; }

      select, button {
        font: inherit;
        font-size: 13px;
        color: var(--fg);
        background: var(--panel-bg);
        border: 1px solid var(--rule-strong);
        border-radius: 6px;
        padding: 4px 9px;
      }

      button { cursor: pointer; }
      button:hover { border-color: var(--accent); color: var(--accent); }

      code {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg-muted);
        background: var(--editor-active);
        border-radius: 4px;
        padding: 1px 5px;
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 570px;
        min-height: 0;
      }

      @media (max-width: 900px) {
        main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr 320px; }
      }

      #editor { min-width: 0; min-height: 0; overflow: hidden; }
      #editor .cm-editor { height: 100%; }

      aside {
        border-left: 1px solid var(--rule);
        background: var(--panel-bg);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .panel { border-bottom: 1px solid var(--rule); padding: 10px 12px; }
      .panel h2 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--fg-faint);
      }

      #status { font-family: var(--mono); font-size: 12px; }
      #status[data-state='ok'] { color: var(--ok); }
      #status[data-state='error'] { color: var(--danger); }

      .field { display: flex; gap: 8px; font-size: 12px; padding: 1px 0; align-items: baseline; }
      .field-label { color: var(--fg-faint); min-width: 92px; flex: none; }
      .field-value { font-family: var(--mono); color: var(--fg); word-break: break-word; }
      .field.is-warning .field-value { color: var(--warning); }

      #errors { display: flex; flex-direction: column; gap: 3px; }
      .error-row { width: 100%; padding: 3px 0; border: 0; border-radius: 0; text-align: left; color: var(--danger); background: none; font-size: 12px; line-height: 1.35; }
      .error-row:hover { color: var(--danger); text-decoration: underline; }

      .conversion-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      #conversion-status { margin-top: 7px; color: var(--fg-muted); font-family: var(--mono); font-size: 12px; line-height: 1.45; white-space: pre-wrap; }
      #conversion-status[data-state='error'] { color: var(--danger); }
      #conversion-status[data-state='ok'] { color: var(--ok); }
      #conversion-output { width: 100%; height: 180px; min-height: 120px; resize: vertical; overflow: hidden; margin-top: 7px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--editor-bg); }

      .cm-tooltip-lint .cm-diagnostic { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
      .cm-tooltip-lint .cm-diagnosticAction { order: -1; float: none; margin: 0; }

      #tree-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; border-bottom: none; }
      #tree { flex: 1; overflow-y: auto; overflow-x: hidden; margin: 0 -12px -10px; }

      .tree-row {
        display: flex;
        gap: 10px;
        width: 100%;
        text-align: left;
        border: none;
        border-radius: 0;
        background: none;
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.55;
        padding: 0 8px 0 6px;
        color: var(--fg-muted);
        white-space: nowrap;
        overflow: hidden;
        min-width: 0;
      }
      .tree-row:hover { background: var(--editor-active); color: var(--fg); }
      .tree-row.is-current { background: var(--editor-active); color: var(--fg); font-weight: 600; }
      .tree-row.is-error { color: var(--danger); }
      .tree-span {
        margin-left: auto;
        color: var(--fg-faint);
        font-weight: 400;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 45%;
      }
      .tree-truncated { padding: 6px 12px; font-size: 11px; color: var(--fg-faint); }

      footer {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
        padding: 8px 16px;
        border-top: 1px solid var(--rule);
        background: var(--panel-bg);
        color: var(--fg-faint);
        font-size: 12px;
      }
      footer a { color: inherit; }
      /* Pushed to the trailing edge, so the hints on the left stay one run of
         text however they wrap. */
      .repo-link { margin-left: auto; }
      .repo-link:hover { color: var(--accent); }

      kbd {
        font-family: var(--mono);
        font-size: 11px;
        border: 1px solid var(--rule-strong);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 0 4px;
        color: var(--fg-muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>codemirror-lang-rdf</h1>
      <p>RDF&nbsp;1.2, SPARQL&nbsp;1.2 and SRL.</p>
      <div class="toolbar">
        <label>Language <select id="language"></select></label>
        <label>SPARQL ↔ SRL helpers <input id="sparql-helpers" type="checkbox" /></label>
        <label>Palette <select id="palette"></select></label>
        <label>Theme <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
        <button type="button" id="reset">Reset sample</button>
      </div>
    </header>

    <main>
      <div id="editor"></div>

      <aside>
        <div class="panel">
          <h2>Parse</h2>
          <div id="status" data-state="ok">…</div>
          <div style="margin-top: 6px"><code id="media-type"></code></div>
        </div>

        <div class="panel" id="error-panel" hidden>
          <h2>Errors</h2>
          <div id="errors"></div>
        </div>

        <div class="panel">
          <h2>At the cursor</h2>
          <div id="cursor"></div>
        </div>

        <div class="panel" id="srl-panel" hidden>
          <h2>What an application reads from the tree</h2>
          <div id="srl-facts"></div>
        </div>

        <div class="panel" id="conversion-panel" hidden>
          <h2>Conversion</h2>
          <div class="conversion-actions">
            <label id="export-form-label"><span id="conversion-direction">Convert to SPARQL</span> <select id="export-form"><option value="construct">CONSTRUCT</option><option value="insert">INSERT</option></select></label>
            <button type="button" id="convert">Convert</button>
            <button type="button" id="copy-conversion">Copy</button>
          </div>
          <div id="conversion-status" aria-live="polite"></div>
          <div id="conversion-output"></div>
        </div>

        <div class="panel" id="tree-panel">
          <h2>Syntax tree</h2>
          <div id="tree"></div>
        </div>
      </aside>
    </main>

    <footer>
      <span>
        Try: fold a block in the gutter · <kbd>Ctrl</kbd>-<kbd>Space</kbd> for completion ·
        <kbd>Tab</kbd> to reindent · break something and watch the rest keep its colour.
      </span>
      <a class="repo-link" href="https://github.com/Kurrawong/codemirror-lang-rdf">Source on GitHub</a>
    </footer>

    <script src="./main.js"></script>
  </body>
</html>
